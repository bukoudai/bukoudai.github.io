  <!-- 配置Tailwind主题 -->

    tailwind.config = {
      darkMode: 'class',

        extend: {
          colors: {

            sans: ['Inter', 'system-ui', 'sans-serif'],

  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .option-hover {
        @apply transition-all duration-200 hover:shadow-md hover:-translate-y-0.5;
      }
      .btn-effect {
        @apply transform transition-all duration-200 active:scale-95;
      }
      .card-shadow {
        @apply shadow-lg dark:shadow-dark/20;
      }
    }

</head>

<body class="bg-light dark:bg-dark text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">
  <!-- 顶部导航栏 -->

        <i class="fa fa-sun-o hidden dark:block text-xl"></i>
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-md">
    <!-- 模式选择区域 -->
    <section id="mode-selector" class="mb-8 bg-white dark:bg-gray-800 rounded-xl p-5 card-shadow">
      <h2 class="text-lg font-semibold mb-4 text-center">选择刷题模式</h2>
      <div class="grid grid-cols-1 gap-3">
        <button id="range-1-50" class="w-full py-3 px-4 bg-primary/10 dark:bg-primary/20 text-primary rounded-lg font-medium option-hover btn-effect border-2 border-primary/30">
          1~50题
        </button>
        <button id="range-51-100" class="w-full py-3 px-4 bg-primary/10 dark:bg-primary/20 text-primary rounded-lg font-medium option-hover btn-effect border-2 border-primary/30">
          51~100题
        </button>
        <button id="random-mode" class="w-full py-3 px-4 bg-accent/10 dark:bg-accent/20 text-accent rounded-lg font-medium option-hover btn-effect border-2 border-accent/30">
          随机出题
        </button>
      </div>
    </section>

    <!-- 题目区域 -->
    <section id="question-container" class="mb-8 bg-white dark:bg-gray-800 rounded-xl p-5 card-shadow hidden">
      <div class="flex justify-between items-center mb-4">
        <span id="question-number" class="text-sm bg-primary/10 dark:bg-primary/20 text-primary px-3 py-1 rounded-full">第1题</span>
        <span id="progress" class="text-sm text-gray-500 dark:text-gray-400">1/50</span>
      </div>
      
      <h3 id="question-content" class="text-lg font-medium mb-6 leading-relaxed">题目内容将在这里显示</h3>
      
      <div id="options" class="space-y-3 mb-6">
        <!-- 选项将通过JS动态生成 -->
      </div>
      
      <div id="explanation" class="hidden bg-gray-50 dark:bg-gray-700/50 p-4 rounded-lg border border-gray-200 dark:border-gray-600 mb-4">
        <div class="flex items-center mb-2">
          <i class="fa fa-check-circle text-secondary mr-2"></i>
          <span id="correct-answer" class="font-medium"></span>
        </div>
        <p id="explanation-text" class="text-sm text-gray-600 dark:text-gray-300"></p>
      </div>
      
      <button id="next-question" class="w-full py-3 bg-primary text-white rounded-lg font-medium hidden option-hover btn-effect">
        下一题 <i class="fa fa-arrow-right ml-1"></i>
      </button>
    </section>

    <!-- 完成提示 -->
    <section id="complete-message" class="mb-8 bg-white dark:bg-gray-800 rounded-xl p-6 text-center card-shadow hidden">
      <div class="w-16 h-16 bg-secondary/20 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa fa-trophy text-2xl text-secondary"></i>
      </div>
      <h2 class="text-xl font-bold mb-2">完成练习！</h2>
      <p class="text-gray-600 dark:text-gray-300 mb-6">恭喜您完成了本次题库练习</p>
      <button id="restart" class="w-full py-3 bg-primary text-white rounded-lg font-medium option-hover btn-effect">
        重新开始 <i class="fa fa-refresh ml-1"></i>
      </button>
    </section>
  </main>

    </div>
  </footer>

        options: ["A、在自家院子里飞行", "B、在机场附近飞行", "C、在军事基地附近飞行"],
        answer: "A",
        explanation: "在自家院子等私人区域低高度飞行通常不需要申请空域，而在机场、军事基地附近飞行需要申请或禁止飞行。"
      },
      {
        id: 98,
        question: "无人机飞行员应遵守的基本原则是",
        options: ["A、安全第一", "B、效率第一", "C、乐趣第一"],
        answer: "A",
        explanation: "无人机飞行应始终坚持安全第一的原则，确保人员和财产安全。"
      },
      {
        id: 99,
        question: "在恶劣天气条件下，无人机飞行员应",
        options: ["A、谨慎飞行", "B、取消飞行", "C、降低飞行高度"],
        answer: "B",
        explanation: "恶劣天气条件下飞行风险极大，无人机飞行员应取消飞行计划，待天气好转后再飞。"
      },
      {
        id: 100,
        question: "无人机飞行结束后，应",
        options: ["A、立即收起来", "B、检查设备并记录飞行日志", "C、先下载照片和视频"],
        answer: "B",
        explanation: "飞行结束后，应先检查无人机各部件是否完好，记录飞行日志，再进行其他操作。"
      }
    ];

    // 全局变量
    let currentMode = null; // 刷题模式：range1-50, range51-100, random
    let currentQuestionIndex = 0; // 当前题目的索引
    let questionOrder = []; // 题目顺序数组
    let answered = false; // 是否已经回答

    // DOM元素
    const modeSelector = document.getElementById('mode-selector');
    const questionContainer = document.getElementById('question-container');
    const completeMessage = document.getElementById('complete-message');
    const questionNumber = document.getElementById('question-number');
    const questionContent = document.getElementById('question-content');
    const optionsContainer = document.getElementById('options');
    const explanation = document.getElementById('explanation');
    const correctAnswerEl = document.getElementById('correct-answer');
    const explanationText = document.getElementById('explanation-text');
    const nextQuestionBtn = document.getElementById('next-question');
    const progressEl = document.getElementById('progress');
    const restartBtn = document.getElementById('restart');
    const themeToggle = document.getElementById('theme-toggle');

    // 初始化主题
    function initTheme() {
      if (localStorage.getItem('theme') === 'dark' || 
          (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    // 切换主题
    themeToggle.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });

    // 生成题目顺序
    function generateQuestionOrder(mode) {
      const order = [];
      if (mode === 'range1-50') {
        // 1-50题顺序模式
        for (let i = 0; i < 50; i++) {
          order.push(i);
        }
      } else if (mode === 'range51-100') {
        // 51-100题顺序模式
        for (let i = 50; i < 100; i++) {
          order.push(i);
        }
      } else if (mode === 'random') {
        // 随机模式 - 从所有100题中随机
        const temp = [...Array(100).keys()];
        for (let i = temp.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [temp[i], temp[j]] = [temp[j], temp[i]];
        }
        order.push(...temp);
      }
      return order;
    }

    // 显示当前题目
    function displayCurrentQuestion() {
      if (currentQuestionIndex >= questionOrder.length) {
        // 所有题目完成
        questionContainer.classList.add('hidden');
        completeMessage.classList.remove('hidden');
        return;
      }

      const questionIndex = questionOrder[currentQuestionIndex];
      const question = questionBank[questionIndex];
      
      questionNumber.textContent = `第${question.id}题`;
      questionContent.textContent = question.question;
      progressEl.textContent = `${currentQuestionIndex + 1}/${questionOrder.length}`;
      
      // 清空选项
      optionsContainer.innerHTML = '';
      
      // 生成选项
      question.options.forEach(option => {
        const optionBtn = document.createElement('button');
        optionBtn.className = 'w-full text-left py-3 px-4 bg-gray-100 dark:bg-gray-700/50 rounded-lg font-medium option-hover btn-effect transition-colors';
        optionBtn.textContent = option;
        optionBtn.dataset.option = option.charAt(0); // 获取选项字母A/B/C/D
        
        optionBtn.addEventListener('click', () => {
          if (!answered) {
            checkAnswer(optionBtn, optionBtn.dataset.option, question.answer);
          }
        });
        
        optionsContainer.appendChild(optionBtn);
      });
      
      // 重置状态
      explanation.classList.add('hidden');
      nextQuestionBtn.classList.add('hidden');
      answered = false;
    }

    // 检查答案
    function checkAnswer(button, selectedOption, correctOption) {
      answered = true;
      const allOptions = optionsContainer.querySelectorAll('button');
      
      // 显示所有选项的正确状态
      allOptions.forEach(btn => {
        const option = btn.dataset.option;
        btn.disabled = true;
        
        if (option === correctOption) {
          // 正确答案
          btn.classList.remove('bg-gray-100', 'dark:bg-gray-700/50');
          btn.classList.add('bg-secondary/20', 'text-secondary', 'border', 'border-secondary/30');
        } else if (option === selectedOption) {
          // 错误选择
          btn.classList.remove('bg-gray-100', 'dark:bg-gray-700/50');
          btn.classList.add('bg-red-100', 'text-red-600', 'dark:bg-red-900/30', 'dark:text-red-400', 'border', 'border-red-300', 'dark:border-red-700');
        }
      });
      
      // 显示解析
      correctAnswerEl.textContent = `正确答案：${correctOption}`;
      explanationText.textContent = questionBank[questionOrder[currentQuestionIndex]].explanation;
      explanation.classList.remove('hidden');
      
      // 显示下一题按钮
      nextQuestionBtn.classList.remove('hidden');
    }

    // 下一题
    function nextQuestion() {
      currentQuestionIndex++;
      displayCurrentQuestion();
      // 滚动到顶部
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 开始刷题
    function startQuiz(mode) {
      currentMode = mode;
      questionOrder = generateQuestionOrder(mode);
      currentQuestionIndex = 0;
      
      modeSelector.classList.add('hidden');
      questionContainer.classList.remove('hidden');
      completeMessage.classList.add('hidden');
      
      displayCurrentQuestion();
    }

    // 重新开始
    function restartQuiz() {
      completeMessage.classList.add('hidden');
      modeSelector.classList.remove('hidden');
    }

    // 事件监听
    document.getElementById('range-1-50').addEventListener('click', () => startQuiz('range1-50'));
    document.getElementById('range-51-100').addEventListener('click', () => startQuiz('range51-100'));
    document.getElementById('random-mode').addEventListener('click', () => startQuiz('random'));
    nextQuestionBtn.addEventListener('click', nextQuestion);
    restartBtn.addEventListener('click', restartQuiz);

    // 初始化
    initTheme();
  </script>
</body>
</html>
