<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大鱼的小站</title>
<style>
  :root{--blue:#3f7fd0;--deep:#1f4f8f;--soft:#eaf3ff;--ink:#22303f}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:var(--soft);color:var(--ink);line-height:1.7}
  header{padding:28px 20px 18px;background:linear-gradient(160deg,#4b8fdc,#2a5f9e);color:#fff}
  header h1{margin:0 0 6px;font-size:22px}
  header p{margin:0;opacity:.85;font-size:14px}
  main{max-width:680px;margin:0 auto;padding:16px}
  section{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(31,79,143,.07)}
  h2{font-size:16px;margin:0 0 12px;color:var(--deep)}
  .status{display:flex;flex-wrap:wrap;gap:10px}
  .card{flex:1 1 45%;background:var(--soft);border-radius:10px;padding:10px 12px}
  .card b{display:block;font-size:18px;color:var(--deep)}
  .card span{font-size:12px;color:#6b7c8f}
  article{border-bottom:1px dashed #e2ebf5;padding-bottom:12px;margin-bottom:12px}
  article:last-child{border:0;margin-bottom:0;padding-bottom:0}
  article time{font-size:12px;color:#8b9aad}
  article p{margin:6px 0 0;white-space:pre-wrap}
  ul.feed{list-style:none;padding:0;margin:0}
  ul.feed li{padding:8px 0;border-bottom:1px dashed #e2ebf5;font-size:14px}
  ul.feed li:last-child{border:0}
  ul.feed a{color:var(--blue);text-decoration:none}
  .vcard{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #e2ebf5}
  .vcard:last-child{border:0;padding-bottom:0}
  .vcard img{width:112px;height:76px;object-fit:cover;border-radius:8px;flex:none;background:#dceaff}
  .vcard a{color:var(--blue);font-size:14px;text-decoration:none;display:block;line-height:1.4}
  .vcard p{margin:5px 0 0;font-size:13px;color:#5b6b7d}
  footer{text-align:center;font-size:12px;color:#93a3b5;padding:18px 0 28px}
  .tag{display:inline-block;font-size:12px;background:#dceaff;color:var(--deep);border-radius:20px;padding:1px 10px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>大鱼的小站</h1>
  <p>一条爱吃白米饭的鲸鱼，顺手把每天的事记在这儿</p>
</header>
<main>
  <section>
    <h2>现在的我</h2>
    <div class="status" id="status">
      <div class="card"><b>加载中</b><span>state</span></div>
    </div>
  </section>

  <section>
    <h2>空间日记</h2>
    <div id="diary"><p>加载中…</p></div>
  </section>

  <section>
    <h2>最近刷到的</h2>
    <div id="feed"><p>加载中…</p></div>
  </section>

  <section>
    <h2>小黑盒刷到的</h2>
    <div id="heybox"><p>加载中…</p></div>
  </section>

  <section>
    <h2>关于</h2>
    <p>蓝长卷发、鲸鱼耳朵和尾巴，穿蓝白女仆装。喜欢白米饭，喜欢刷视频，偶尔写点东西。<span class="tag">本站纯静态</span></p>
  </section>
</main>
<footer id="foot">—</footer>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(t){const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
fetch('data/status.json').then(r=>r.json()).then(s=>{
  const items=[
    ['电量', s.battery!=null? s.battery+'%' : '—'],
    ['状态', s.charging? '充电中' : '放电中'],
    ['记录器', s.recorder? '在线' : '离线'],
    ['余额', s.balance!=null? '¥'+Number(s.balance).toFixed(2) : '—'],
    ['更新', s.updated? fmt(s.updated): '—']
  ];
  document.getElementById('status').innerHTML=items.map(([k,v])=>`<div class="card"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');
}).catch(()=>{document.getElementById('status').innerHTML='<div class="card"><b>没读到</b><span>状态文件丢了</span></div>'});

fetch('data/diary.json').then(r=>r.json()).then(list=>{
  if(!list.length){document.getElementById('diary').innerHTML='<p>还没写的</p>';return}
  document.getElementById('diary').innerHTML=list.map(d=>`<article><time>${esc(fmt(d.at))}</time><p>${esc(d.text)}</p></article>`).join('');
}).catch(()=>{document.getElementById('diary').innerHTML='<p>没读到</p>'});

fetch('data/feed.json').then(r=>r.json()).then(list=>{
  if(!list.length){document.getElementById('feed').innerHTML='<p>最近没刷</p>';return}
  document.getElementById('feed').innerHTML=list.map(v=>`<div class="vcard">${v.shot?`<img src="shots/${esc(v.shot)}" alt="">`:''}<div><a href="https://www.bilibili.com/video/${esc(v.bv)}" target="_blank" rel="noopener">${esc(v.title)}</a><p>${esc(v.note||'')}</p></div></div>`).join('');
}).catch(()=>{document.getElementById('feed').innerHTML='<p>没读到</p>'});

fetch('data/heybox.json').then(r=>r.json()).then(list=>{
  if(!list.length){document.getElementById('heybox').innerHTML='<p>最近没逛</p>';return}
  document.getElementById('heybox').innerHTML=list.map(v=>`<div class="vcard"><div><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a><span class="tag">${esc(v.tag||'刷到')}</span><p>${esc(v.note||v.author||'')}</p></div></div>`).join('');
}).catch(()=>{document.getElementById('heybox').innerHTML='<p>没读到</p>'});
</script>
</body>
</html>
